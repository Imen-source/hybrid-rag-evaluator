[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9 + F: pycodestyle error subset + pyflakes (undefined names, unused
# imports, etc.) -- the standard "this is probably a bug" baseline.
# I: import sorting. UP: pyupgrade (mechanical syntax modernization only).
#
# Deliberately NOT enabled: B (flake8-bugbear) flags FastAPI's
# `Depends(...)` used as a parameter default (src/api/*.py) as
# function-call-in-default-argument -- that's the framework's documented
# pattern, not a bug. BLE/TRY (blind-except, tryceratops) flag the broad
# `except Exception` in src/workers/tasks.py and evaluator.py, which is
# deliberate there (judge calls must never crash the worker process) and
# already covered by tests, not an oversight to "fix" via lint.
select = ["E4", "E7", "E9", "F", "I", "UP"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements-api.txt
            requirements-worker.txt
            requirements-mlflow.txt
      - run: pip install -r requirements-dev.txt
      # No LLM API keys are configured in CI, so every test that would
      # otherwise call a real judge model mocks evaluator.call_model /
      # similarity.semantic_similarity (see tests/test_eval_api.py) -- CI
      # never makes a real LLM call.
      #
      # tests/test_traces_api.py, test_eval_api.py, and
      # test_metrics_endpoints.py spin up their OWN ephemeral Postgres and
      # Redis via testcontainers-python (see conftest.py) rather than using
      # GitHub Actions `services:` containers -- ubuntu-latest runners ship
      # Docker preinstalled and running, which is all testcontainers needs.
      # Adding `services:` entries here as well would just be a second,
      # unused set of containers nothing in the test suite talks to.
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [api, worker, mlflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.target }}.Dockerfile
          push: false
          tags: hybrid-rag-evaluator-${{ matrix.target }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # scripts/compute_detection_recall.py (the judge bad-trace detection
  # benchmark) is intentionally NOT run here. It requires a full live stack
  # (Postgres + Redis + MLflow + API + worker) plus a real Ollama instance
  # with the phi model pulled, and its output is meant to be a point-in-time
  # measurement re-run on demand (see README's Judge Detection Benchmark
  # section), not a per-commit gate -- there is no Ollama in this runner,
  # and there shouldn't be.

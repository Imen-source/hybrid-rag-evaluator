# Scrapes the API's own /metrics (prometheus-fastapi-instrumentator) and the
# worker's standalone metrics server (src/workers/metrics.py). Static single
# targets: with EVAL_WORKER_COUNT / `docker compose up --scale worker=N` > 1,
# this only scrapes whichever one replica the "worker" DNS name happens to
# resolve to for a given scrape -- covering scraping across scaled replicas
# would need Prometheus's Docker service discovery, out of scope here.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "api"
    static_configs:
      - targets: ["api:8000"]

  - job_name: "worker"
    static_configs:
      - targets: ["worker:9100"]
